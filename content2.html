
<style>
  .palette-container { padding: 20px; font-family: Arial, sans-serif; }
  .palette-title { font-size: 1.8rem; text-align: center; margin-bottom: 6px; }
  .palette-subtitle { text-align: center; color: #666; margin-bottom: 24px; }
  .palette-controls { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .palette-gen-btn {
    padding: 10px 24px; font-size: 1rem; border: none;
    border-radius: 10px; background: #4a90e2; color: white;
    cursor: pointer; transition: background 0.2s;
  }
  .palette-gen-btn:hover { background: #357abd; }
  .palette-count-label { font-size: 0.95rem; color: #555; }
  .palette-count-input {
    width: 60px; padding: 6px 8px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 1rem; text-align: center;
  }
  .palette-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
  }
  .palette-swatch {
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    cursor: pointer; transition: transform 0.15s;
  }
  .palette-swatch:hover { transform: scale(1.05); }
  .palette-swatch-color { height: 90px; }
  .palette-swatch-info {
    background: white; padding: 8px; text-align: center;
  }
  .palette-hex { font-size: 0.85rem; font-weight: bold; color: #333; font-family: monospace; }
  .palette-rgb { font-size: 0.72rem; color: #888; margin-top: 2px; }
  .palette-copy-hint { font-size: 0.7rem; color: #aaa; margin-top: 2px; }
  .palette-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: white; padding: 10px 22px; border-radius: 20px;
    font-size: 0.9rem; opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .palette-toast.show { opacity: 1; }
</style>

<div class="palette-container">
  <div class="palette-title">🎨 색상 팔레트 생성기</div>
  <div class="palette-subtitle">랜덤 색상을 생성하고, 클릭하면 HEX 코드가 복사돼요!</div>

  <div class="palette-controls">
    <label class="palette-count-label">색상 수:</label>
    <input class="palette-count-input" id="palette-count" type="number" value="8" min="1" max="20">
    <button class="palette-gen-btn" id="palette-gen-btn">🎲 생성하기</button>
  </div>

  <div class="palette-grid" id="palette-grid"></div>
</div>

<div class="palette-toast" id="palette-toast">클립보드에 복사됨!</div>

<script>
(function() {
  function randomHex() {
    return '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0').toUpperCase();
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function showToast(msg) {
    const toast = document.getElementById('palette-toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function generatePalette() {
    const count = Math.min(Math.max(parseInt(document.getElementById('palette-count').value) || 8, 1), 20);
    const grid  = document.getElementById('palette-grid');
    grid.innerHTML = '';

    for (let i = 0; i < count; i++) {
      const hex = randomHex();
      const swatch = document.createElement('div');
      swatch.className = 'palette-swatch';
      swatch.innerHTML = `
        <div class="palette-swatch-color" style="background:${hex}"></div>
        <div class="palette-swatch-info">
          <div class="palette-hex">${hex}</div>
          <div class="palette-rgb">${hexToRgb(hex)}</div>
          <div class="palette-copy-hint">클릭해서 복사</div>
        </div>`;
      swatch.addEventListener('click', () => {
        navigator.clipboard.writeText(hex).then(() => {
          showToast(`✅ ${hex} 복사됨!`);
        }).catch(() => {
          showToast(`${hex}`);
        });
      });
      grid.appendChild(swatch);
    }
  }

  document.getElementById('palette-gen-btn').addEventListener('click', generatePalette);
  generatePalette();
})();
</script>
